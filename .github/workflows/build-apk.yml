name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Web Application
        run: pnpm run build

      - name: Sync with Capacitor Android
        run: pnpm exec cap sync android

      - name: Build Android APK (Debug / Sideloadable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ComicRead.apk
          ls -lh ComicRead.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicRead-APK
          path: ComicRead.apk
          retention-days: 30

      - name: Create / Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determinar nombre del tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v1.0.0"
          fi

          echo "Publicando release con tag: $RELEASE_TAG"

          # Intentar borrar el release previo si existe para sobreescribir el APK
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true

          # Crear release con el APK adjunto
          gh release create "$RELEASE_TAG" ComicRead.apk \
            --title "ComicRead ${RELEASE_TAG}" \
            --notes "### ComicRead - Lector de Cómics de Alto Rendimiento

          Descarga e instala **ComicRead.apk** en tu teléfono Android.

          #### Novedades:
          - Soporte de archivos locales **.cbz** y **.cbr** con descompresión en background thread.
          - Modos de lectura: **Occidental (LTR)**, **Manga (RTL)** y **Webtoon (Scroll Vertical)**.
          - Gestos táctiles: Pinch-to-zoom (1x a 4x), swipe horizontal y doble toque.
          - Almacenamiento y progreso de lectura 100% offline."
